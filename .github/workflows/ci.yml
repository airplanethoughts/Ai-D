name: Verify Ai-D
on: [push, pull_request]
permissions:
  contents: read
jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze
      - run: flutter test
      - run: flutter test test/free_deployment_test.dart --dart-define=ENABLE_AI=false --dart-define=ENABLE_UPLOADS=false
      - run: flutter build web --no-wasm-dry-run
      - run: flutter build web --no-wasm-dry-run --dart-define-from-file=config/firebase.emulator.json
  backend-and-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm ci --prefix functions
      - run: npm run test:deploy
      - run: npm test --prefix functions
      - run: npm run test:rules
